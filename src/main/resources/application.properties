spring.application.name=asset-management-v1

# ==========================================================
# PostgreSQL
# ==========================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================================
# JPA / Hibernate
# ==========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================================================
# Server
# ==========================================================
server.port=${PORT:8080}

# ==========================================================
# File uploads (Service Billing invoices, etc.)
# ==========================================================
# Raised from the original 10MB so Haoda File Center can distribute larger
# files (installers, drivers) alongside the smaller invoice/document uploads
# that already relied on this same global limit — existing uploads under
# 10MB are completely unaffected, this only raises the ceiling.
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:200MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:200MB}

# ==========================================================
# Amazon S3 (Invoice storage)
# ==========================================================
# Invoices used to be written to local disk (app.upload.dir), which is why
# they disappeared on every Render redeploy: Render's filesystem is
# ephemeral and is wiped/rebuilt on each deploy. Invoices are now stored
# permanently in Amazon S3 instead — S3StorageService uploads/downloads/
# deletes objects in the bucket below, and only the resulting S3 object key
# (never the file bytes, never a local path) is persisted in PostgreSQL.
#
# Credentials are read from environment variables ONLY — never hardcode
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY anywhere in this file or in
# source control. On Render, set these as environment variables on the
# service (Dashboard -> your service -> Environment):
#   AWS_ACCESS_KEY_ID=<your access key id>
#   AWS_SECRET_ACCESS_KEY=<your secret access key>
#   AWS_S3_BUCKET_NAME=haodaasset-invoices-vikkash-2026
#   AWS_S3_REGION=us-east-1
#
# If AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY are left unset, S3Config falls
# back to the AWS SDK's default credentials provider chain (useful for local
# dev machines that already have the AWS CLI configured, or if this is ever
# deployed onto real AWS compute with an instance profile).
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:haodaasset-invoices-vikkash-2026}
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.accessKeyId=${AWS_ACCESS_KEY_ID:}
aws.secretKey=${AWS_SECRET_ACCESS_KEY:}
# How long a presigned URL generated by S3StorageService.generateFileUrl()
# stays valid for, in minutes. Not used by the View/Download invoice
# endpoints (which stream through the backend so Spring Security's ADMIN
# guard keeps applying) — available for future features that need a
# shareable, time-limited direct S3 link.
aws.s3.presigned-url-expiry-minutes=${AWS_S3_PRESIGNED_URL_EXPIRY_MINUTES:15}

# Max size (in MB) allowed for a single invoice upload, enforced by
# S3StorageService in addition to (and always <= ) the global multipart
# ceiling below.
app.upload.max-file-size-mb=${INVOICE_MAX_UPLOAD_MB:20}
# Folder where uploaded asset documents (warranty cards, manuals, insurance
# papers, etc. attached via the Document Management module) are stored.
app.storage.document-upload-dir=${DOCUMENT_UPLOAD_DIR:uploads/asset-documents}
# Folder where Haoda File Center uploads (guides, policies, installers,
# drivers, etc.) are stored.
app.storage.file-center-upload-dir=${FILE_CENTER_UPLOAD_DIR:uploads/file-center}
# Business-level max upload size enforced by File Center itself (in addition
# to, and always <= , the global multipart ceiling above). Configurable
# independently so admins can tune it without touching the global setting.
app.filecenter.max-upload-mb=${FILE_CENTER_MAX_UPLOAD_MB:100}
# Base URL of the deployed frontend, used to build the deep link encoded in
# each asset's QR code (opens the Assets page directly on that asset).
app.frontend.base-url=${FRONTEND_BASE_URL:https://haodaasset.vercel.app}
# Optional: path to Tesseract's trained-language data, used only as a fallback when
# an uploaded invoice PDF for auto-fill has no text layer (i.e. it's a scanned image).
# Leave blank to use Tess4j's bundled default; text-based invoices don't need this at all.
app.ocr.tessdata-path=${OCR_TESSDATA_PATH:}

# ==========================================================
# JWT
# ==========================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==========================================================
# Credential Encryption
# ==========================================================
app.encryption.secret=${CREDENTIAL_ENCRYPTION_SECRET}

# ==========================================================
# Email (Brevo Transactional Email REST API — HTTPS, no SMTP)
# ==========================================================
app.brevo.api-key=${BREVO_API_KEY}
app.mail.from=${MAIL_FROM}
app.mail.from-name=${MAIL_FROM_NAME:Haoda Asset}
# CC'd on every outbound email (all send methods in EmailService)
app.mail.cc=${MAIL_CC:itsupport@haodapayments.com}

# ==========================================================
# OTP
# ==========================================================
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:3}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:30}

app.security.credential-unlock-seconds=${CREDENTIAL_UNLOCK_SECONDS:60}

app.admin.recovery-email=${ADMIN_RECOVERY_EMAIL:}

# ==========================================================
# Google Sign-In
# ==========================================================
# The OAuth 2.0 Web Client ID from Google Cloud Console (Credentials ->
# OAuth client ID -> Web application). This MUST match the client ID the
# React app initializes google.accounts.id with — GoogleTokenVerifier
# rejects any ID token whose "aud" claim doesn't equal this value, so a
# mismatch here fails every Google login attempt (safely, not silently).
app.google.client-id=${GOOGLE_CLIENT_ID:}

# ==========================================================
# Role / Permission seeding
# ==========================================================
# Set false in production to skip creating the demo "admin" account and the
# 5 demo employees on first boot. Roles and Permissions themselves always
# seed regardless (the application depends on them existing) — this flag
# only controls the demo identities.
app.seed.demo-data=${SEED_DEMO_DATA:true}
# Password for the seeded default admin account. Leave unset to have a
# random 16-character password generated and printed to the log ONCE on
# first boot — there is no hardcoded fallback (a hardcoded default password
# living in source control is a real vulnerability the moment anyone forgets
# to change it in production). Set this explicitly before first boot in any
# shared/production environment.
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD:}


# Admin login 2FA: every admin login OTP is sent here (IT Support inbox),
# not to the individual admin's personal recovery email.
app.admin.2fa-email=${ADMIN_2FA_EMAIL:itsupport@haodapayments.com}

# Asset assignment admin notification: every "asset assigned" summary email
# is sent here (fixed IT Support inbox), regardless of which admin performed
# the assignment.
app.admin.assignment-notification-email=${ADMIN_ASSIGNMENT_NOTIFICATION_EMAIL:itsupport@haodapayments.com}

# ==========================================================
# Groq (AI Assistant — free OpenAI-compatible Chat Completions API,
# no payment method required — https://console.groq.com/keys)
# ==========================================================
# Never hardcode the key — set GROQ_API_KEY as an environment variable on
# your host (Render dashboard -> service -> Environment), same pattern as
# BREVO_API_KEY/JWT_SECRET above.
groq.api.key=${GROQ_API_KEY}
# llama-3.3-70b-versatile is a strong free default with solid tool-calling
# support; swap models via env var without a redeploy if you want to try
# others available on Groq (e.g. llama-3.1-8b-instant for lower latency).
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}

# ==========================================================
# Logging
# ==========================================================
logging.level.com.vikkash.assetmanagementv1=INFO
logging.level.com.vikkash.assetmanagementv1.security=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.root=WARN
