spring.application.name=asset-management-v1

# ── PostgreSQL ──────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/asset_management
spring.datasource.username=postgres
spring.datasource.password=1234

# ddl-auto=update is fine for development. For production, switch to
# "validate" and manage schema changes via Flyway or Liquibase.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Enable SQL logging only when needed by setting to true locally
# spring.jpa.show-sql=true

server.port=8080

# ── JWT ─────────────────────────────────────────────────────────────────────
# IMPORTANT: In production, inject via environment variable:
#   app.jwt.secret=${JWT_SECRET}
# The secret must be at least 32 characters (256 bits) for HS256.
app.jwt.secret=CHANGE_ME_super_secret_signing_key_min_32_chars_long_!!
app.jwt.expiration-ms=86400000

# ── Logging ─────────────────────────────────────────────────────────────────
# Application code logs at INFO+; security filter at DEBUG only when needed
logging.level.com.vikkash.assetmanagementv1=INFO
logging.level.com.vikkash.assetmanagementv1.security=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.root=WARN
