spring.application.name=asset-management-v1

# ==========================================================
# PostgreSQL
# ==========================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================================
# JPA / Hibernate
# ==========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================================================
# Server
# ==========================================================
server.port=${PORT:8080}

# ==========================================================
# JWT
# ==========================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==========================================================
# Credential Encryption
# ==========================================================
app.encryption.secret=${CREDENTIAL_ENCRYPTION_SECRET}

# ==========================================================
# Email
# ==========================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000

app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.from-name=${MAIL_FROM_NAME:Haoda Asset}

# ==========================================================
# OTP
# ==========================================================
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:3}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:30}

app.security.credential-unlock-seconds=${CREDENTIAL_UNLOCK_SECONDS:60}

app.admin.recovery-email=${ADMIN_RECOVERY_EMAIL:}

# ==========================================================
# Logging
# ==========================================================
logging.level.com.vikkash.assetmanagementv1=INFO
logging.level.com.vikkash.assetmanagementv1.security=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.root=WARN