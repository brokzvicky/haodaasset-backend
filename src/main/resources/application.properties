spring.application.name=asset-management-v1

# ==========================================================
# PostgreSQL
# ==========================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================================
# JPA / Hibernate
# ==========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================================================
# Server
# ==========================================================
server.port=${PORT:8080}

# ==========================================================
# File uploads (Service Billing invoices, etc.)
# ==========================================================
# Raised from the original 10MB so Haoda File Center can distribute larger
# files (installers, drivers) alongside the smaller invoice/document uploads
# that already relied on this same global limit — existing uploads under
# 10MB are completely unaffected, this only raises the ceiling.
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:200MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:200MB}

# Folder where uploaded PDF invoices are stored, PERMANENTLY, on local disk.
#
# IMPORTANT: this must be an ABSOLUTE path, not a relative one. A relative
# path (e.g. "uploads/invoices") resolves against the JVM's current working
# directory, which is NOT fixed — it changes depending on how you launch the
# app (IDE "Run" vs "Debug", `mvn spring-boot:run` from a terminal, or
# `java -jar target/app.jar` run from inside target/). If the working
# directory ever happens to be (or resolve into) target/, running
# `mvn clean` wipes the entire target/ folder — silently deleting every
# invoice ever uploaded. This is almost certainly why your invoices
# "disappeared": they were never lost, they were written under whatever
# folder happened to be the working directory at the time, then deleted
# by a clean/rebuild, or simply left behind in a folder you're no longer
# looking at.
#
# Fix: point this at a fixed, absolute, non-project location outside
# target/ and outside any folder Maven/Git ever touches.
#
# Windows note: Java .properties files treat backslash as an escape
# character, so use forward slashes even for a Windows path:
#   app.upload.dir=C:/HaodaAsset/uploads/invoices
# (C:\HaodaAsset\uploads\invoices also works fine at runtime once read by
# java.nio.file.Paths — just don't write a bare backslash in this file.)
#
# Override per-environment via the INVOICE_UPLOAD_DIR env var, e.g. in
# production point it at a persistent disk/volume (Render/EBS-mounted path)
# so files survive deploys/restarts there too.
app.upload.dir=${INVOICE_UPLOAD_DIR:C:/HaodaAsset/uploads/invoices}

# Max size (in MB) allowed for a single invoice upload, enforced by
# FileStorageService in addition to (and always <= ) the global multipart
# ceiling below.
app.upload.max-file-size-mb=${INVOICE_MAX_UPLOAD_MB:20}
# Folder where uploaded asset documents (warranty cards, manuals, insurance
# papers, etc. attached via the Document Management module) are stored.
app.storage.document-upload-dir=${DOCUMENT_UPLOAD_DIR:uploads/asset-documents}
# Folder where Haoda File Center uploads (guides, policies, installers,
# drivers, etc.) are stored.
app.storage.file-center-upload-dir=${FILE_CENTER_UPLOAD_DIR:uploads/file-center}
# Business-level max upload size enforced by File Center itself (in addition
# to, and always <= , the global multipart ceiling above). Configurable
# independently so admins can tune it without touching the global setting.
app.filecenter.max-upload-mb=${FILE_CENTER_MAX_UPLOAD_MB:100}
# Base URL of the deployed frontend, used to build the deep link encoded in
# each asset's QR code (opens the Assets page directly on that asset).
app.frontend.base-url=${FRONTEND_BASE_URL:https://haodaasset.vercel.app}
# Optional: path to Tesseract's trained-language data, used only as a fallback when
# an uploaded invoice PDF for auto-fill has no text layer (i.e. it's a scanned image).
# Leave blank to use Tess4j's bundled default; text-based invoices don't need this at all.
app.ocr.tessdata-path=${OCR_TESSDATA_PATH:}

# ==========================================================
# JWT
# ==========================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==========================================================
# Credential Encryption
# ==========================================================
app.encryption.secret=${CREDENTIAL_ENCRYPTION_SECRET}

# ==========================================================
# Email (Brevo Transactional Email REST API — HTTPS, no SMTP)
# ==========================================================
app.brevo.api-key=${BREVO_API_KEY}
app.mail.from=${MAIL_FROM}
app.mail.from-name=${MAIL_FROM_NAME:Haoda Asset}

# ==========================================================
# OTP
# ==========================================================
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:3}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:30}

app.security.credential-unlock-seconds=${CREDENTIAL_UNLOCK_SECONDS:60}

app.admin.recovery-email=${ADMIN_RECOVERY_EMAIL:}

# Admin login 2FA: every admin login OTP is sent here (IT Support inbox),
# not to the individual admin's personal recovery email.
app.admin.2fa-email=${ADMIN_2FA_EMAIL:itsupport@haodapayments.com}

# Asset assignment admin notification: every "asset assigned" summary email
# is sent here (fixed IT Support inbox), regardless of which admin performed
# the assignment.
app.admin.assignment-notification-email=${ADMIN_ASSIGNMENT_NOTIFICATION_EMAIL:itsupport@haodapayments.com}

# ==========================================================
# Logging
# ==========================================================
logging.level.com.vikkash.assetmanagementv1=INFO
logging.level.com.vikkash.assetmanagementv1.security=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.root=WARN
