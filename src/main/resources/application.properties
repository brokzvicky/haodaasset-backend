spring.application.name=asset-management-v1

# ==========================================================
# PostgreSQL
# ==========================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================================
# JPA / Hibernate
# ==========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================================================
# Server
# ==========================================================
server.port=${PORT:8080}

# ==========================================================
# File uploads (Service Billing invoices, etc.)
# ==========================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Folder where uploaded PDF invoices are stored.
# LOCAL DEV: a relative path is fine (resolves under the project root you
# launch the app from).
# PRODUCTION: this MUST be set to an ABSOLUTE path on a persistent, durable
# volume/disk that survives restarts and redeploys (e.g. a Render Persistent
# Disk mounted at /data, an EBS-backed EC2 path, or equivalent network
# storage). A path left on the container's local/ephemeral filesystem WILL
# be wiped on the next deploy/restart — this is what causes "invoice file
# could not be found" 404s even though the database record is intact.
app.storage.invoice-upload-dir=${INVOICE_UPLOAD_DIR:uploads/invoices}
# Folder where uploaded asset documents (warranty cards, manuals, insurance
# papers, etc. attached via the Document Management module) are stored.
# Same production requirement as above: must be an absolute, persistent path.
app.storage.document-upload-dir=${DOCUMENT_UPLOAD_DIR:uploads/asset-documents}
# Base URL of the deployed frontend, used to build the deep link encoded in
# each asset's QR code (opens the Assets page directly on that asset).
app.frontend.base-url=${FRONTEND_BASE_URL:https://haodaasset.vercel.app}
# Optional: path to Tesseract's trained-language data, used only as a fallback when
# an uploaded invoice PDF for auto-fill has no text layer (i.e. it's a scanned image).
# Leave blank to use Tess4j's bundled default; text-based invoices don't need this at all.
app.ocr.tessdata-path=${OCR_TESSDATA_PATH:}

# ==========================================================
# JWT
# ==========================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==========================================================
# Credential Encryption
# ==========================================================
app.encryption.secret=${CREDENTIAL_ENCRYPTION_SECRET}

# ==========================================================
# Email (Brevo Transactional Email REST API — HTTPS, no SMTP)
# ==========================================================
app.brevo.api-key=${BREVO_API_KEY}
app.mail.from=${MAIL_FROM}
app.mail.from-name=${MAIL_FROM_NAME:Haoda Asset}

# ==========================================================
# OTP
# ==========================================================
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:3}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:30}

app.security.credential-unlock-seconds=${CREDENTIAL_UNLOCK_SECONDS:60}

app.admin.recovery-email=${ADMIN_RECOVERY_EMAIL:}

# Admin login 2FA: every admin login OTP is sent here (IT Support inbox),
# not to the individual admin's personal recovery email.
app.admin.2fa-email=${ADMIN_2FA_EMAIL:itsupport@haodapayments.com}

# Asset assignment admin notification: every "asset assigned" summary email
# is sent here (fixed IT Support inbox), regardless of which admin performed
# the assignment.
app.admin.assignment-notification-email=${ADMIN_ASSIGNMENT_NOTIFICATION_EMAIL:itsupport@haodapayments.com}

# ==========================================================
# Logging
# ==========================================================
logging.level.com.vikkash.assetmanagementv1=INFO
logging.level.com.vikkash.assetmanagementv1.security=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.root=WARN
