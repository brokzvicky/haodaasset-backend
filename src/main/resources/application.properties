spring.application.name=asset-management-v1

# ==========================================================
# PostgreSQL
# ==========================================================
# SECURITY: credentials must come from environment variables, never be
# committed to source control. Set these in your shell, your IDE's run
# config, or your hosting provider's environment-variable settings
# (e.g. Render → Environment).
#
#   DB_URL=jdbc:postgresql://<host>/<database>?sslmode=require
#   DB_USERNAME=<username>
#   DB_PASSWORD=<password>
#
# The previous version of this file had a live Neon Postgres password and
# JWT secret committed in plaintext. Both must be treated as compromised
# and rotated (Neon dashboard -> reset password; generate a new JWT secret)
# regardless of this change.
spring.datasource.url=jdbc:postgresql://ep-silent-heart-at5td93k-pooler.c-9.us-east-1.aws.neon.tech:5432/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_s6FvJIYnCWX1
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================================
# JPA / Hibernate
# ==========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================================================
# Server
# ==========================================================
server.port=${PORT:8080}

# ==========================================================
# JWT
# ==========================================================
# Must be set via environment variable. Generate a new, random 256-bit+
# secret (e.g. `openssl rand -base64 48`) - do not reuse the old hardcoded
# value, since it was committed to source and must be considered leaked.
app.jwt.secret=my-super-secret-key-123456789012345678901234567890
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==========================================================
# Credential Encryption (Network Credentials module)
# ==========================================================
# AES-256 key used to encrypt/decrypt network device passwords. Must be set
# via environment variable, same as app.jwt.secret above — never hardcode
# this. Generate with: openssl rand -base64 48
#
# IMPORTANT: if this value ever changes after credentials have been saved,
# all previously-encrypted passwords become permanently undecryptable
# (this is by design — it's how the encryption provides real security).
# Back this value up somewhere safe (e.g. your password manager / secrets
# vault), separately from the database itself.
app.encryption.secret=my-encryption-secret-key-12345678901234567890

# ==========================================================
# Email (used for Admin Forgot-Password OTP and Network Credential
# unlock OTP). Configure with an app-password / SMTP relay credential,
# never a raw account password.
# ==========================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

# Display name/address OTP emails are sent from. Falls back to the SMTP
# username if not set separately.
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.from-name=${MAIL_FROM_NAME:AssetTower Security}

# ==========================================================
# Email OTP security (Forgot Password + Network Credential unlock)
# ==========================================================
# OTPs are never persisted to the database — they live only in server
# memory for the duration of their validity window, then are discarded.
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:3}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:30}

# How long a successful "view sensitive credentials" OTP verification stays
# unlocked before the UI must re-verify with a fresh OTP.
app.security.credential-unlock-seconds=${CREDENTIAL_UNLOCK_SECONDS:60}

# Optional: recovery email applied to the seeded default admin account on
# first startup, if it doesn't already have one set in the database.
app.admin.recovery-email=${ADMIN_RECOVERY_EMAIL:}

# ==========================================================
# Logging
# ==========================================================
logging.level.com.vikkash.assetmanagementv1=INFO
logging.level.com.vikkash.assetmanagementv1.security=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.root=WARN
